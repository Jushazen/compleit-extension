<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Access Blocked — Compleit</title>
		<link rel="stylesheet" href="blocked.css" />
	</head>
	<body>
		<div class="page">
			<div class="card">
				<div class="card-top">
					<span id="badge" class="badge badge-blocked">Blocked</span>
					<h1 id="title">Complete today's tasks to continue</h1>
					<p id="subtitle">
						Browsing is locked. Click a task below to work on it.
					</p>
				</div>

				<ul id="task-list" class="task-list"></ul>

				<div class="card-footer">
					<div class="progress-row">
						<div class="progress-track">
							<div id="progress-fill" class="progress-fill"></div>
						</div>
						<span id="progress-label" class="progress-label"
							>0 / 0</span
						>
					</div>
				</div>
			</div>
		</div>
		<script src="blocked.js"></script>
	</body>
</html>
